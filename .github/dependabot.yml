# .github/dependabot.yml
version: 2
updates:
  # 1. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-patch-minor:
        update-types: [ "patch", "minor" ]

  # 2. Node.js (npm / yarn / pnpm)
  - package-ecosystem: "npm"
    directories:
    - "/my-astro-blog"
    - "/my-astro-blog/*"
    schedule:
      interval: "daily"
    groups:
      astro-patch-minor:
        update-types: [ "patch", "minor" ]