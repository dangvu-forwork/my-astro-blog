name: Deploying to Dev Server
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    environment: CDK Dev
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: dev-server
      CDK_STACK_NAME: Dev-ContainerStack
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists (Create it, if not)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Find ECS cluster and service
        id: ecs
        run: |
          set -euo pipefail

          resources="$(aws cloudformation list-stack-resources \
            --stack-name "$CDK_STACK_NAME" \
            --region "$AWS_REGION" \
            --output json)"

          cluster="$(jq -er '
            [.StackResourceSummaries[]
              | select(.ResourceType == "AWS::ECS::Cluster")
              | .PhysicalResourceId]
            | if length == 1 then .[0] else error("Expected exactly one ECS cluster in the stack") end
          ' <<< "$resources")"
          service="$(jq -er '
            [.StackResourceSummaries[]
              | select(.ResourceType == "AWS::ECS::Service")
              | .PhysicalResourceId]
            | if length == 1 then .[0] else error("Expected exactly one ECS service in the stack") end
          ' <<< "$resources")"

          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Redeploy ECS service
        env:
          ECS_CLUSTER: ${{ steps.ecs.outputs.cluster }}
          ECS_SERVICE: ${{ steps.ecs.outputs.service }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"