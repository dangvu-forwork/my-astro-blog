name: Deploying to Dev Server
on:
  push:
    branches: [dev-server]
    paths:
      - "my-astro-blog/**"
      - ".github/workflows/development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: AWS CDK
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: dev-server
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account and ECS service-linked role
        run: |
          aws sts get-caller-identity
          aws iam get-role --role-name AWSServiceRoleForECS --query Role.Arn --output text

      - name: Ensure ECR repository exists (Create it, if not)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./my-astro-blog
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/my-astro-blog:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/my-astro-blog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS Express Mode
        id: deploy-express
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: my-astro-blog
          image: ${{ steps.login-ecr.outputs.registry }}/my-astro-blog:${{ github.sha }}
          execution-role-arn: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 4321
          environment-variables: |
            [
              {"name":"HOST","value":"0.0.0.0"},
              {"name":"PORT","value":"4321"}
            ]
          health-check-path: /api/health
          cpu: '256' # 256 CPU units, or 0.25 vCPU.
          memory: '512' # 512 MiB, about 0.5GB of memory. Not too much.
          min-task-count: 1  
          max-task-count: 1 # Will not scale beyond 1 task

      - name: Show service URL
        env:
          SERVICE_URL: ${{ steps.deploy-express.outputs.endpoint }}
        run: echo "Backend deployed at $SERVICE_URL"

