name: Deploying to Dev Server
on:
  push:
    branches: [dev-server]
    paths:
      - "my-astro-blog/**"
      - ".github/workflows/development.yml"
  workflow_dispatch:

concurrency:
  group: development-${{ github.ref }} # Runs for the same branch will be put into one concurrency group
  cancel-in-progress: true # If something's already running, just cancel that run and prioritize this new one

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: CDK Dev
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: dev-server
      CDK_STACK_NAME: Dev-ContainerStack
      DESIRED_COUNT: 1
      CONTAINER_CPU: 256
      CONTAINER_MEMORY_MIB: 512
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # I have to delete my repositories sometimes, as they consume my free credits.
      # I am running on a budget.
      - name: Ensure ECR repository exists (Create it, if not)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # I should replace the convoluted previous deployment step with this new one
      # I won't remove the one in deployment.yml since uh what if I make a fatal mistake? i would still need a reference point...
      - name: Build, Tag & Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f my-astro-blog/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" my-astro-blog
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Set up Node.js for CDK
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: my-astro-blog/cdk/package-lock.json

      - name: Install CDK dependencies
        working-directory: my-astro-blog/cdk
        run: npm ci

      - name: Deploy load balancer and ECS service
        working-directory: my-astro-blog/cdk
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: npx cdk deploy "$CDK_STACK_NAME" --require-approval never --context imageTag="$IMAGE_TAG"
