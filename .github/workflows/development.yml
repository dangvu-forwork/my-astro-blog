name: Deploying to Dev Server
on:
  pull_request:
    branches: [dev-server]
    paths:
      - "my-astro-blog/**"
      - ".github/workflows/development.yml"
  workflow_dispatch:

concurrency:
  group: development-${{ github.ref }} # Runs for the same branch will be put into one concurrency group
  cancel-in-progress: true # If something's already running, just cancel that run and prioritize this new one

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.pull_request.merged }} # Only run when merging a feature branch with the dev branch. Will test soon...
    runs-on: ubuntu-latest
    environment: CDK Dev
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: dev-server
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # I have to delete my repositories sometimes, as they consume my free credits.
      # I am running on a budget.
      - name: Ensure ECR repository exists (Create it, if not)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f my-astro-blog/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            my-astro-blog
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
